# Deploy automático: push a main → SSH → build → pm2 restart
# Requiere Repository Secrets: SERVER_HOST, SERVER_PORT, SERVER_USER, SERVER_SSH_KEY
name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Intercert server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Tiempo extra: npm ci + astro build
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail

            export NVM_DIR="$HOME/.nvm"
            # shellcheck disable=SC1091
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22

            cd /home/icltmits173/portal-partners

            echo "==> git status (antes)"
            git status -sb
            git fetch origin main
            git pull --ff-only origin main

            # Nunca tocar .env ni videos en el deploy
            test -f .env || { echo "ERROR: falta .env en el server"; exit 1; }

            echo "==> Node $(node -v) / npm $(npm -v)"
            npm ci
            npm run build
            test -f dist/server/entry.mjs

            # Asegurar que PM2 use el Node 22 de nvm
            export PATH="$(dirname "$(which node)"):$PATH"
            pm2 restart portal-partners --update-env
            pm2 save

            echo "==> smoke"
            sleep 2
            curl -s -o /dev/null -w "GET / -> %{http_code}\n" http://127.0.0.1:5173/
            curl -s -o /dev/null -w "POST /api/login -> %{http_code}\n" \
              -X POST http://127.0.0.1:5173/api/login \
              -H 'Content-Type: application/json' \
              -d '{}'

            pm2 status portal-partners
            echo "==> deploy OK"
